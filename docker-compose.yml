services:
  yt-downloader:
    build: .
    container_name: yt-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system-status"]
      interval: 30s
      timeout: 5s
      retries: 3
